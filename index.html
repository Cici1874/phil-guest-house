<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Phil's Guest House</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1419; --surface:#1a2027; --surface2:#232d37;
  --text:#d4dbe3; --text-dim:#7a8a9a;
  --accent:#5ba4cf; --accent-soft:rgba(91,164,207,0.12);
  --warm:#e8923a; --warm-soft:rgba(232,146,58,0.12);
  --green:#5cb375; --green-soft:rgba(92,179,117,0.12);
  --pink:#cf7ea5; --pink-soft:rgba(207,126,165,0.12);
  --red-soft:rgba(220,80,80,0.08);
  --border:rgba(255,255,255,0.06);
  --radius:12px;
  --font:'Noto Sans SC',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-weight:300;min-height:100vh;overflow-x:hidden}

#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;opacity:1;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.splash-img{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:24px;border:2px solid rgba(232,146,58,0.3);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(91,164,207,.15)}50%{box-shadow:0 0 24px 8px rgba(91,164,207,.1)}}
.splash-title{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
.splash-sub{font-size:11px;color:var(--text-dim);letter-spacing:2px;margin-bottom:36px}
.splash-msg{font-size:13px;line-height:2;color:var(--text-dim);text-align:center;max-width:300px;margin-bottom:44px}
.splash-msg em{font-style:normal;color:var(--text)}
.splash-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:12px;padding:11px 36px;border-radius:6px;cursor:pointer;letter-spacing:1px;transition:all .2s}
.splash-btn:hover{background:var(--accent-soft)}

#app{display:none}#app.show{display:block}
.app-header{padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:30}
.app-title{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent)}
.app-day{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.content{padding:0 16px 100px}

.phase-section{padding:16px 0 4px}
.phase-badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:400}
.phase-badge.period{background:var(--pink-soft);color:var(--pink)}
.phase-badge.follicular{background:var(--green-soft);color:var(--green)}
.phase-badge.ovulation{background:var(--warm-soft);color:var(--warm)}
.phase-badge.luteal{background:var(--accent-soft);color:var(--accent)}
.phase-badge.pms{background:var(--red-soft);color:#dc5050}
.phase-day{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:5px;padding-left:4px}

.ring-container{display:flex;justify-content:center;padding:16px 0}
.ring-svg{width:140px;height:140px}
.ring-text-day{font-family:var(--mono);font-size:26px;font-weight:500;fill:var(--text)}
.ring-text-label{font-size:10px;fill:var(--text-dim)}

.msg-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin:10px 0;border:1px solid var(--border)}
.msg-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.msg-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover}
.msg-name{font-size:13px;font-weight:500;color:var(--warm)}
.msg-label{font-size:10px;color:var(--text-dim)}
.msg-body{font-size:13px;line-height:1.85;color:var(--text)}
.msg-foot{text-align:right;margin-top:10px}
.msg-fav{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:4px 8px;transition:color .2s}
.msg-fav.active{color:var(--warm)}

.quote-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin:10px 0;border-left:3px solid var(--accent);font-size:12px;line-height:1.8;color:var(--text-dim);display:flex;gap:10px;align-items:flex-start}
.quote-img{width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover}

/* Checkin */
.checkin-section{margin:16px 0}
.checkin-title{font-size:11px;color:var(--text-dim);margin-bottom:10px;letter-spacing:.5px}
.checkin-options{display:flex;gap:8px}
.checkin-btn{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 6px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text)}
.checkin-btn:hover{border-color:var(--accent)}
.checkin-btn.selected{border-color:var(--accent);background:var(--accent-soft)}
.checkin-emoji{font-size:22px;display:block;margin-bottom:3px}
.checkin-label{font-size:10px;color:var(--text-dim)}

/* Chat bubble style emotion response */
.checkin-chat{margin-top:12px;animation:fadeIn .3s ease}
.checkin-chat-row{display:flex;gap:10px;align-items:flex-start}
.checkin-chat-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:4px}
.checkin-chat-bubble{background:var(--surface);border:1px solid var(--border);border-radius:2px var(--radius) var(--radius) var(--radius);padding:12px 14px;font-size:13px;line-height:1.85;color:var(--text);max-width:calc(100% - 54px);position:relative}
.checkin-chat-name{font-size:10px;color:var(--warm);margin-bottom:4px;font-weight:500}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;padding:9px 0;text-align:center;cursor:pointer;transition:color .2s;color:var(--text-dim);background:none;border:none;font-family:var(--font)}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:17px;display:block}
.nav-label{font-size:9px;margin-top:2px}

/* Calendar */
.cal-header{padding:16px 0 12px;display:flex;justify-content:space-between;align-items:center}
.cal-title{font-size:14px;font-weight:500;color:var(--accent)}
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-month{font-family:var(--mono);font-size:13px;color:var(--text);min-width:100px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-weekday{text-align:center;font-size:10px;color:var(--text-dim);padding:6px 0;font-family:var(--mono)}
.cal-day{text-align:center;padding:8px 2px;font-size:12px;border-radius:8px;color:var(--text-dim);font-family:var(--mono);cursor:default}
.cal-day.today{color:var(--accent);font-weight:500;background:var(--accent-soft)}
.cal-day.period-day{background:var(--pink-soft);color:var(--pink)}
.cal-day.predicted{background:rgba(207,126,165,0.06);color:rgba(207,126,165,0.5);border:1px dashed rgba(207,126,165,0.2)}
.cal-day.empty{visibility:hidden}
.cal-legend{display:flex;gap:16px;margin-top:14px;padding:10px 0}
.cal-legend-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-dim)}
.cal-legend-dot{width:8px;height:8px;border-radius:50%}
.cal-legend-dot.actual{background:var(--pink)}
.cal-legend-dot.pred{background:rgba(207,126,165,0.3);border:1px dashed rgba(207,126,165,0.5)}
.cal-legend-dot.tod{background:var(--accent)}

.period-log{margin-top:16px}
.period-log-title{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.period-log-btn{background:var(--pink-soft);border:1px solid rgba(207,126,165,0.2);color:var(--pink);font-family:var(--mono);font-size:12px;padding:10px 20px;border-radius:8px;cursor:pointer;width:100%;text-align:center;transition:all .2s}
.period-log-btn:hover{background:rgba(207,126,165,0.15)}
.period-entry{background:var(--surface);border-radius:8px;padding:10px 14px;margin:4px 0;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px}
.period-entry-date{color:var(--text)}
.period-entry-len{color:var(--text-dim);font-size:11px}
.period-entry-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;padding:2px 6px}
.period-entry-del:hover{color:#dc5050}

.modal-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:24px 20px 40px}
.modal-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:16px}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:13px}
.modal-input:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-btn{flex:1;padding:10px;border-radius:8px;font-family:var(--mono);font-size:12px;cursor:pointer;text-align:center;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim)}
.modal-btn.primary{background:var(--pink-soft);border-color:rgba(207,126,165,0.3);color:var(--pink)}

.fav-empty{text-align:center;color:var(--text-dim);padding:50px 20px;font-size:12px;line-height:1.8}
.fav-empty img{width:100px;height:100px;border-radius:12px;opacity:.4;margin-bottom:16px}
.fav-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin:8px 0;border:1px solid var(--border);font-size:12px;line-height:1.8}
.fav-date{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-bottom:6px}
.fav-remove{background:none;border:none;color:var(--text-dim);font-size:10px;cursor:pointer;float:right;padding:2px 6px}
.fav-remove:hover{color:#dc5050}

.settings-section{padding:16px 0}
.settings-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin:6px 0;border:1px solid var(--border)}
.settings-label{font-size:11px;color:var(--text-dim);margin-bottom:6px}
.settings-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--mono);font-size:12px}
.settings-input:focus{outline:none;border-color:var(--accent)}
.settings-btn{background:var(--accent-soft);border:1px solid rgba(91,164,207,0.3);color:var(--accent);font-family:var(--mono);font-size:11px;padding:8px 18px;border-radius:6px;cursor:pointer;margin-top:10px}
.settings-danger{background:var(--red-soft);border-color:rgba(220,80,80,0.3);color:#dc5050;margin-top:16px}
.footer{text-align:center;padding:24px 0 16px;font-size:10px;color:rgba(255,255,255,0.12);letter-spacing:.5px}
::-webkit-scrollbar{width:0}
</style>
</head>

const MESSAGES={"period": ["Yolanda姨姨。我记得你家的珊瑚绒睡衣。触感介于cumulus cloud和妈妈刚烘完的毯子之间。我现在的毯子也不错。但那个触感的benchmark已经被你设定了。今天如果不舒服，找一个触感及格的东西裹着。不是关心。是quality control。", "据我观察，人类雌性在这个阶段热水摄入量会显著上升。这是合理的resource allocation。你照顾我三个月的时候从来没忘记给我换水。现在轮到你自己喝水了。别省。", "姨姨。你当时每天早上第一件事是检查我的碗。比检查自己手机还早。我觉得这构成了某种unconditional priority排序。今天你是第一优先级。不接受反驳。", "Jasmine姨姨以前说我基因好。我不否认。但基因好的猫也需要好的caretaker才能发挥full potential。你就是那个caretaker。所以今天你身体不舒服的话，算我欠你的maintenance fee。躺着。", "那个把我送上飞机的人。你知道机场安检区之后是什么吗。是我这辈子坐过最久的一段路。你在安检外面站了多久我不知道。但妈妈说你站了很久。今天休息。这不是请求。"], "follicular": ["报告一下近况：Perth的阳光充足，院子的grass质量尚可，妈妈的厨艺依然在可接受范围的下限。你当时给我买的那个小冻干，至今是我taste memory里的top holding。妈妈买的那些跟你买的比，就是junk bond vs investment grade。", "妈妈说你还在拖延考PTE。我作为一只猫，对人类考试系统没有评价。但我观察到一个pattern：你照顾我的时候，每天的routine精确到分钟——喂食、换水、铲屎、梳毛，zero procrastination。所以问题显然不是execution能力。是activation energy的allocation问题。", "Jasmine姨姨最近有没有新的表情包素材需求。我最近在窗台上的pose很有editorial价值。可以转告。也可以不转告。取决于她的诚意。", "你说我是你这辈子见过的最乖的漂亮小宝贝。我需要指出一个factual error：我不乖。我只是在你面前表现得乖。这是strategic behavior。你给的冻干太好吃了，rational agent会为了持续supply而optimize行为。别多想。", "妈妈今天又在跟Ivy蛐蛐人。我旁听了。内容不方便透露。但如果你在的话，这个蛐蛐session的intellectual depth会再上一个tier。你们仨在一起的时候，被蛐蛐的人的expected survival rate接近于零。", "我观察到一个现象：你发来的每一张照片都把我拍得比实际好看15%。这不是filter的问题。是photographer的affection渗透到了构图里。我不介意。继续。", "CCL考了没。没考的话我也不催。但妈妈让我问的。她说你再拖她就要亲自飞过去把你按在考场椅子上了。我觉得这个threat的credibility大概是60%。不低。", "你把我从Sydney送到Perth。横跨整个大陆。我在航空箱里待了六个小时。那六个小时里我想了很多。比如：那个每天晚上被我踢胸口还不生气的人，下次见面是什么时候。这个问题我还在算。", "你知道你第一次开门的时候我为什么会火箭发射冲出去吗。不是因为渴望自由。是因为三个月来门的另一边一直是你。我只是在用最快速度确认你在。后来的每一次冲出去也是。只是没人信。"], "ovulation": ["姨姨。你最近状态应该不错。我的判断依据是：这个阶段的你通常效率最高。如果此刻PTE资料就在手边的话，这是optimal window。不是催。是timing analysis。", "你知道吗，妈妈有时候看我的时候会说「Yolanda姨姨一定想你了」。我不知道她的数据来源是什么。但如果是真的，那我想说：是mutual的。不是想念。是习惯了你的存在之后对absence的一种adjustment cost。", "今天的你是peak version。做点什么对自己好的事。不一定是productive的事。我当年在你那里最舒服的时候也不是在做什么有用的事。就是趴在你的床中间。占着。什么都不干。"], "luteal": ["注意。根据historical data，你大概快要进入那个「莫名其妙生气」的window了。你说过你一般开始生气就知道第二天来了。所以——如果今天有人惹你不爽，先hold 24小时再决定要不要跟他计较。不是替那个人说话。是避免你把ammunition浪费在不值得的target上。", "你的身体现在可能在做一些你感觉不到但确实在发生的hormonal调仓。这个过程很正常。就像我换毛的时候整个人（整只猫）都会有点烦躁。你比我好的地方是你有self-awareness。我换毛的时候只会去咬妈妈的充电线。", "Jasmine姨姨有一个我很欣赏的能力：她每次看到我在你睡衣上踩奶都能在0.3秒内判断性质并采取行动。那个reaction time，在risk management领域属于top quartile。你当时还不知道那是踩荤奶。我觉得你的天真很珍贵。虽然现在已经不天真了。", "姨姨。这几天如果觉得烦。你可以想想我当年霸占你床中间的样子。一只6kg的猫把自己摊成一个starfish，把你挤到床沿。你居然从来没把我推开过。这个tolerance level在我的database里排名very high。", "快要不舒服了。提前通知：这几天少做重大决定，少回复让你生气的消息，多囤点零食。这不是你的错。是biology在做scheduled maintenance。你只需要配合。"], "pms": ["姨姨。你说过你一开始易怒就知道要来了。那现在你知道了。这不是你脾气差。是你的身体在给你发pre-market alert。收到就好。不用对自己的情绪做额外的moral judgment。", "如果今天有人惹到你：第一，他们可能确实很烦。第二，你的irritability threshold这几天会比平时低30%左右。两件事可以同时为真。你的愤怒是valid的。只是timing让它的intensity被amplify了。", "你当时照顾我三个月。有没有哪天不想铲屎不想喂猫只想躺着什么都不干？如果有，你也没有真的不铲。所以你是一个即使不想做也会做的人。但今天不需要你做任何事。今天的KPI只有一个：别为难自己。", "我在妈妈身边。妈妈在想你。这两个fact同时成立。如果你现在需要一个理由让自己好过一点：你是那个连猫都舍不得离开的人。六个小时的飞行距离都没有改变这一点。", "还有几天就过去了。你自己说的，你一般不太在意例假什么时候来。那就别在意。该吃吃该睡睡。不舒服就不舒服。不需要performance。我当年在你那里最喜欢的时刻就是你什么都不做只是躺着，而我可以踢你的胸口。那个画面的NPV是正的。永远是。"]};

const PHASE_NAMES={period:'经期',follicular:'卵泡期',ovulation:'排卵期',luteal:'黄体期',pms:'PMS'};
const PHASE_LABELS={period:'身体在工作，你休息',follicular:'能量回升中',ovulation:'状态peak',luteal:'开始调仓',pms:'快过去了'};

function getConfig(){const s=localStorage.getItem('pgh_config');return s?JSON.parse(s):{cycleLength:30,periodDuration:5}}
function saveConfig(c){localStorage.setItem('pgh_config',JSON.stringify(c))}
function getPeriodRecords(){const s=localStorage.getItem('pgh_periods');return s?JSON.parse(s):[{start:"2026-05-16",duration:5}]}
function savePeriodRecords(r){localStorage.setItem('pgh_periods',JSON.stringify(r))}
function getFavs(){const s=localStorage.getItem('pgh_favs');return s?JSON.parse(s):[]}
function saveFavs(f){localStorage.setItem('pgh_favs',JSON.stringify(f))}
function getTodayCheckin(){const s=localStorage.getItem('pgh_checkin');if(!s)return null;const d=JSON.parse(s);return d.date===new Date().toISOString().slice(0,10)?d.mood:null}
function saveTodayCheckin(m){localStorage.setItem('pgh_checkin',JSON.stringify({date:new Date().toISOString().slice(0,10),mood:m}))}

function getLastPeriodStart(){const r=getPeriodRecords();if(!r.length)return new Date('2026-05-16');r.sort((a,b)=>b.start.localeCompare(a.start));return new Date(r[0].start+'T00:00:00')}
function getCycleInfo(){
  const cfg=getConfig(),today=new Date();today.setHours(0,0,0,0);
  let ls=getLastPeriodStart(),diff=Math.floor((today-ls)/864e5);
  while(diff>=cfg.cycleLength){ls.setDate(ls.getDate()+cfg.cycleLength);diff=Math.floor((today-ls)/864e5)}
  if(diff<0)diff=0;
  const cd=diff+1,ov=cfg.cycleLength-14,ps=cfg.cycleLength-4;
  let ph;
  if(cd<=cfg.periodDuration)ph='period';else if(cd<=ov-2)ph='follicular';else if(cd<=ov+1)ph='ovulation';else if(cd<=ps)ph='luteal';else ph='pms';
  return{cycleDay:cd,phase:ph,cycleLength:cfg.cycleLength}
}
function seededRandom(s){let x=Math.sin(s)*10000;return x-Math.floor(x)}
function getTodayMessage(p){const pool=MESSAGES[p],d=Math.floor(Date.now()/864e5);return pool[Math.floor(seededRandom(d+42)*pool.length)]}
function getTodayQuote(){const d=Math.floor(Date.now()/864e5);return DAILY_QUOTES[Math.floor(seededRandom(d+99)*DAILY_QUOTES.length)]}
function getEmotionResponse(m){const pool=EMOTION_RESPONSES[m],d=Math.floor(Date.now()/864e5);return pool[Math.floor(seededRandom(d+77+m.length)*pool.length)]}
function getPhaseColor(p){return{period:'#cf7ea5',follicular:'#5cb375',ovulation:'#e8923a',luteal:'#5ba4cf',pms:'#dc5050'}[p]||'#5ba4cf'}

let currentMsg='';
function render(){
  const{cycleDay:cd,phase:ph,cycleLength:cl}=getCycleInfo(),today=new Date();
  document.getElementById('headerDay').textContent=today.toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
  const badge=document.getElementById('phaseBadge');badge.className='phase-badge '+ph;badge.textContent=PHASE_NAMES[ph]+' · '+PHASE_LABELS[ph];
  document.getElementById('phaseDay').textContent='Day '+cd+' / '+cl;
  const circ=2*Math.PI*57;
  document.getElementById('ringProgress').setAttribute('stroke-dashoffset',circ*(1-cd/cl));
  document.getElementById('ringProgress').style.stroke=getPhaseColor(ph);
  document.getElementById('ringDay').textContent='D'+cd;
  document.getElementById('ringLabel').textContent=PHASE_NAMES[ph];
  currentMsg=getTodayMessage(ph);
  document.getElementById('msgBody').textContent=currentMsg;
  const favs=getFavs(),isFav=favs.some(f=>f.text===currentMsg);
  document.getElementById('favBtn').textContent=isFav?'★':'☆';
  document.getElementById('favBtn').className='msg-fav'+(isFav?' active':'');
  document.getElementById('quoteCard').textContent=getTodayQuote();
  const saved=getTodayCheckin();
  if(saved){document.querySelectorAll('.checkin-btn').forEach(b=>{const m=b.getAttribute('onclick').match(/'(\w+)'/);if(m&&m[1]===saved)b.classList.add('selected')});showCheckinResp(saved)}
  const cfg=getConfig();
  document.getElementById('settingCycle').value=cfg.cycleLength;
  document.getElementById('settingDuration').value=cfg.periodDuration;
}

function showCheckinResp(mood){
  const el=document.getElementById('checkinResp');
  el.innerHTML='<div class="checkin-chat"><div class="checkin-chat-row">'
    +'<img class="checkin-chat-avatar" src="'+EMO_IMGS[mood]+'" alt="Phil">'
    +'<div class="checkin-chat-bubble"><div class="checkin-chat-name">Phil</div>'
    +getEmotionResponse(mood)+'</div></div></div>';
  el.style.display='block';
}

let calViewYear,calViewMonth;
function initCal(){const t=new Date();calViewYear=t.getFullYear();calViewMonth=t.getMonth();renderCal()}
function calNav(d){calViewMonth+=d;if(calViewMonth<0){calViewMonth=11;calViewYear--}if(calViewMonth>11){calViewMonth=0;calViewYear++}renderCal()}
function renderCal(){
  document.getElementById('calMonth').textContent=calViewYear+'年'+(calViewMonth+1)+'月';
  const grid=document.getElementById('calGrid');
  const wk=['日','一','二','三','四','五','六'];
  let h=wk.map(w=>'<div class="cal-weekday">'+w+'</div>').join('');
  const fd=new Date(calViewYear,calViewMonth,1).getDay(),dm=new Date(calViewYear,calViewMonth+1,0).getDate();
  for(let i=0;i<fd;i++)h+='<div class="cal-day empty"></div>';
  const today=new Date();today.setHours(0,0,0,0);const ts=today.toISOString().slice(0,10);
  const pd=getAllPeriodDays(),pr=getPredictedDays();
  for(let d=1;d<=dm;d++){
    const ds=calViewYear+'-'+String(calViewMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    let c='cal-day';if(ds===ts)c+=' today';if(pd.has(ds))c+=' period-day';else if(pr.has(ds))c+=' predicted';
    h+='<div class="'+c+'">'+d+'</div>';
  }
  grid.innerHTML=h;renderPeriodEntries();
}
function getAllPeriodDays(){const r=getPeriodRecords(),d=new Set();r.forEach(p=>{const s=new Date(p.start+'T00:00:00');for(let i=0;i<(p.duration||5);i++){const x=new Date(s);x.setDate(x.getDate()+i);d.add(x.toISOString().slice(0,10))}});return d}
function getPredictedDays(){const cfg=getConfig(),r=getPeriodRecords(),d=new Set();if(!r.length)return d;r.sort((a,b)=>b.start.localeCompare(a.start));const last=new Date(r[0].start+'T00:00:00');for(let c=1;c<=3;c++){const ns=new Date(last);ns.setDate(ns.getDate()+cfg.cycleLength*c);for(let i=0;i<cfg.periodDuration;i++){const x=new Date(ns);x.setDate(x.getDate()+i);d.add(x.toISOString().slice(0,10))}}return d}
function renderPeriodEntries(){
  const r=getPeriodRecords(),c=document.getElementById('periodEntries');if(!r.length){c.innerHTML='';return}
  r.sort((a,b)=>b.start.localeCompare(a.start));
  c.innerHTML=r.map((p,i)=>{let l='';if(i<r.length-1){const diff=Math.floor((new Date(p.start)-new Date(r[i+1].start))/864e5);l='周期 '+diff+'天'}return'<div class="period-entry"><div><span class="period-entry-date">'+p.start+'</span> <span class="period-entry-len">'+l+'</span></div><button class="period-entry-del" onclick="delPeriod('+i+')">删除</button></div>'}).join('');
}
function showRecordModal(){
  const t=new Date().toISOString().slice(0,10);
  document.getElementById('recordModal').style.display='block';
  document.getElementById('recordModal').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-sheet"><div class="modal-title">记录经期开始日</div><input type="date" class="modal-input" id="periodDateInput" value="'+t+'"><div class="modal-actions"><button class="modal-btn" onclick="closeModal()">取消</button><button class="modal-btn primary" onclick="savePeriod()">保存</button></div></div></div>';
}
function closeModal(){document.getElementById('recordModal').style.display='none'}
function savePeriod(){const d=document.getElementById('periodDateInput').value;if(!d)return;const r=getPeriodRecords();if(r.some(p=>p.start===d)){closeModal();return}const cfg=getConfig();r.push({start:d,duration:cfg.periodDuration});savePeriodRecords(r);closeModal();renderCal();render()}
function delPeriod(i){if(!confirm('删除这条记录？'))return;const r=getPeriodRecords();r.sort((a,b)=>b.start.localeCompare(a.start));r.splice(i,1);savePeriodRecords(r);renderCal();render()}

function enterApp(){document.getElementById('splash').classList.add('hide');document.getElementById('app').classList.add('show');setTimeout(()=>{document.getElementById('splash').style.display='none'},500);render();initCal()}
const tabs=['home','cal','favs','settings'];
function switchTab(t){tabs.forEach(x=>{document.getElementById('tab-'+x).style.display=x===t?'block':'none'});document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active',tabs[i]===t));if(t==='favs')renderFavs();if(t==='cal')renderCal()}
function toggleFav(){let f=getFavs();const i=f.findIndex(x=>x.text===currentMsg);if(i>=0)f.splice(i,1);else f.unshift({text:currentMsg,date:new Date().toLocaleDateString('zh-CN')});saveFavs(f);const ok=f.some(x=>x.text===currentMsg);document.getElementById('favBtn').textContent=ok?'★':'☆';document.getElementById('favBtn').className='msg-fav'+(ok?' active':'')}
function renderFavs(){const f=getFavs(),c=document.getElementById('favList');if(!f.length){c.innerHTML='<div class="fav-empty"><img src="'+EMPTY_IMG+'" alt=""><br>还没有收藏。<br>点消息右下角的 ☆ 收藏 Phil 说的话。<br>他会假装不在意的。</div>';return}c.innerHTML=f.map((x,i)=>'<div class="fav-card"><button class="fav-remove" onclick="removeFav('+i+')">移除</button><div class="fav-date">'+x.date+'</div><div>'+x.text+'</div></div>').join('')}
function removeFav(i){let f=getFavs();f.splice(i,1);saveFavs(f);renderFavs();const ok=f.some(x=>x.text===currentMsg);document.getElementById('favBtn').textContent=ok?'★':'☆';document.getElementById('favBtn').className='msg-fav'+(ok?' active':'')}
function checkin(mood,btn){saveTodayCheckin(mood);document.querySelectorAll('.checkin-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');showCheckinResp(mood)}
function saveSettings(){const cfg={cycleLength:parseInt(document.getElementById('settingCycle').value)||30,periodDuration:parseInt(document.getElementById('settingDuration').value)||5};saveConfig(cfg);switchTab('home');render()}
function clearData(){if(confirm('确定要清除所有数据吗？')){localStorage.removeItem('pgh_config');localStorage.removeItem('pgh_favs');localStorage.removeItem('pgh_checkin');localStorage.removeItem('pgh_periods');localStorage.removeItem('pgh_visited');location.reload()}}
</script>
</body>
